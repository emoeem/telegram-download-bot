name: archive-race

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  archive-race:
    name: archive race
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - name: Install Fyne/GLFW build dependencies
        run: sudo apt-get update && sudo apt-get install -y libgl1-mesa-dev libx11-dev libxcursor-dev libxrandr-dev libxinerama-dev libxi-dev libxxf86vm-dev pkg-config
      - name: Race test
        run: go test -race ./archive/... ./cmd -count=1
