distributionBase=GRADLE_USER_HOME
distributionPath=wrapper/dists
# AGP 8.7.3 requires Gradle 8.9+. Pinning it here means a fresh checkout builds
# against the same Gradle the release was cut with; without the wrapper the
# build silently uses whatever `gradle` happens to be on PATH.
# services.gradle.org is unreachable from mainland China (the wrapper dies with
# an SSL EOF mid-download). Tencent's mirror carries the identical official
# artifact; drop the comment if you are on a network that reaches upstream.
distributionUrl=https\://mirrors.cloud.tencent.com/gradle/gradle-8.9-bin.zip
networkTimeout=10000
validateDistributionUrl=true
zipStoreBase=GRADLE_USER_HOME
zipStorePath=wrapper/dists
