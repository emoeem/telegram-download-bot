# ============================================================
#  Telegram 下载器 · Windows 配置文件
# ------------------------------------------------------------
#  这个文件只影响 tdl.exe（命令行 / 归档面板）。
#  桌面版「Telegram下载器.exe」的设置在软件界面里改，不读这个文件。
#
#  普通用户不用改任何东西，直接用即可。
# ============================================================

# Telegram 应用凭据。
# 下面填的是 Telegram 官方桌面客户端的公开凭据，用于让「归档面板」
# 具备管理功能（添加监控、下载媒体等）。
# 如果归档面板提示「只能浏览、不能管理」，就是这里没生效。
telegram:
  app-id: 2040
  app-hash: "b18441a1ff607e10a989891a5462e627"

# 网络代理。国内直连不上 Telegram 时必须填。
# 格式：http://127.0.0.1:7890  或  socks5://127.0.0.1:1080
# 留空表示不使用代理（先直连试试）。
tdl:
  proxy: ""

# 归档会话加密口令（可选，进阶）。
# 填了以后，保存在本机的 Telegram 登录状态会被加密，
# 每次启动归档面板要输入这个口令。建议填，但请务必记住。
archive:
  session-passphrase: ""
