<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<meta name="referrer" content="no-referrer">
<title>登录 · Telegram Archive</title>
<link rel="stylesheet" href="/static/theme.css">
<style>
/* token 全部来自 /static/theme.css（与主界面同一份 :root）：
   以前这里复制了一套 --bg/--surface/--fg，改主界面配色时登录页不会跟着变。 */
body{display:flex;align-items:center;justify-content:center;padding:var(--sp-5)}
.card{width:100%;max-width:380px;background:var(--bg-surface);border:1px solid var(--border-default);border-radius:var(--r-card);padding:var(--sp-6) var(--sp-5);box-shadow:var(--shadow-lg)}
.brand{display:flex;align-items:center;gap:8px;font-size:var(--fs-lg);font-weight:700;letter-spacing:.01em;margin-bottom:4px}
.brand .dot{width:8px;height:8px;border-radius:50%;background:var(--accent);flex:none;box-shadow:0 0 0 4px var(--accent-soft)}
.sub{color:var(--fg-secondary);font-size:var(--fs-sm);margin:0 0 var(--sp-5)}
label{display:block;color:var(--fg-secondary);font-size:var(--fs-xs);margin-bottom:6px;letter-spacing:.02em}
input[type=text],input[type=password]{width:100%;background:var(--bg-input);border:1px solid var(--border-default);color:var(--fg-primary);border-radius:var(--r-md);padding:11px var(--sp-3);font:inherit;outline:none;transition:border-color var(--t-fast) var(--ease),box-shadow var(--t-fast) var(--ease)}
input[type=text]:focus,input[type=password]:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
input::placeholder{color:var(--fg-tertiary)}
.field{margin-bottom:var(--sp-4)}
button{width:100%;border:1px solid var(--accent);background:var(--accent);color:var(--fg-inverse);border-radius:var(--r-md);padding:11px 14px;font:inherit;font-weight:600;cursor:pointer;transition:background var(--t-fast) var(--ease),border-color var(--t-fast) var(--ease)}
button:hover:not(:disabled){background:var(--accent-hover);border-color:var(--accent-hover)}
button:disabled{opacity:.6;cursor:default}
.err{display:flex;gap:8px;align-items:flex-start;background:var(--danger-soft);border:1px solid var(--state-danger);color:var(--state-danger);border-radius:var(--r-md);padding:10px var(--sp-3);font-size:var(--fs-sm);margin-bottom:18px;line-height:1.45}
.err:before{content:"!";font-weight:700;flex:none;width:16px;height:16px;border:1px solid currentColor;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:11px;margin-top:1px}
.foot{margin-top:22px;padding-top:16px;border-top:1px solid var(--border-default);color:var(--fg-tertiary);font-size:var(--fs-xs);line-height:1.6;display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}
.foot code{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:var(--fs-xs)}
.theme{background:none;border:1px solid var(--border-default);color:var(--fg-secondary);width:auto;padding:3px var(--sp-2);font-size:11px;font-weight:400;border-radius:var(--r-sm)}
.theme:hover{background:var(--bg-surface);border-color:var(--border-strong);color:var(--fg-primary)}
@media(max-width:420px){.card{padding:var(--sp-5) var(--sp-4)}}
</style>
</head>
<body>
<form class="card" method="post" action="/login" autocomplete="on">
  <div class="brand"><span class="dot"></span>Telegram Archive</div>
  <p class="sub">这个归档库是私有的，请先登录。</p>
  {{ERROR}}
  <div class="field">
    <label for="u">账号</label>
    <input id="u" name="username" type="text" autocomplete="username" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="用户名" value="{{USER}}" required autofocus>
  </div>
  <div class="field">
    <label for="p">密码</label>
    <input id="p" name="password" type="password" autocomplete="current-password" placeholder="密码" required>
  </div>
  <input type="hidden" name="next" value="{{NEXT}}">
  <button type="submit" id="go">登录</button>
  <div class="foot">
    <span>会话 {{TTL}} 后过期</span>
    <button type="button" class="theme" id="theme">切换主题</button>
  </div>
</form>
<script>
(function(){
  // 必须和 index.html 的 applyTheme/initTheme 用同一个键。这里原来写的是
  // "tdl-archive-theme"，两边各存各的：在登录页点的"切换主题"进主界面就丢，
  // 主界面选的主题回到登录页也不生效。
  var KEY="theme";
  function apply(t){ if(t==="light"){document.documentElement.setAttribute("data-theme","light");}else{document.documentElement.removeAttribute("data-theme");} }
  try{ apply(localStorage.getItem(KEY)); }catch(e){}
  document.getElementById("theme").addEventListener("click",function(){
    var light=document.documentElement.getAttribute("data-theme")==="light";
    var next=light?"dark":"light";
    apply(next);
    try{ localStorage.setItem(KEY,next); }catch(e){}
  });
  document.querySelector("form").addEventListener("submit",function(){
    var b=document.getElementById("go");
    b.disabled=true; b.textContent="验证中…";
  });
  var p=document.getElementById("p");
  if(document.getElementById("u").value){ p.focus(); }
})();
</script>
</body>
</html>
