<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<meta name="referrer" content="no-referrer">
<title>登录 · Telegram Archive</title>
<style>
:root{color-scheme:dark;--bg:#080a0f;--surface:#10141d;--input:#0d1118;--fg:#e9edf5;--muted:#8993a5;--tertiary:#687386;--border:#242b38;--border-strong:#3a4354;--accent:#2AABEE;--accent-hover:#229edb;--danger:#f0808f;--danger-bg:rgba(240,128,143,.1)}
[data-theme="light"]{color-scheme:light;--bg:#f4f7fb;--surface:#fff;--input:#f8fafc;--fg:#17212b;--muted:#5f6b78;--tertiary:#7c8793;--border:#d8e0e8;--border-strong:#b9c6d3;--accent:#229ed9;--accent-hover:#168dcc;--danger:#c83c4d;--danger-bg:rgba(200,60,77,.08)}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{background:var(--bg);color:var(--fg);font:14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;display:flex;align-items:center;justify-content:center;padding:24px;transition:background 200ms ease,color 200ms ease}
.card{width:100%;max-width:380px;background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:32px 28px;box-shadow:0 18px 48px rgba(0,0,0,.24)}
.brand{display:flex;align-items:center;gap:8px;font-size:15px;font-weight:700;letter-spacing:.01em;margin-bottom:4px}
.brand .dot{width:8px;height:8px;border-radius:50%;background:var(--accent);flex:none;box-shadow:0 0 0 4px rgba(42,171,238,.14)}
.sub{color:var(--muted);font-size:13px;margin:0 0 24px}
label{display:block;color:var(--muted);font-size:12px;margin-bottom:6px;letter-spacing:.02em}
input[type=text],input[type=password]{width:100%;background:var(--input);border:1px solid var(--border);color:var(--fg);border-radius:6px;padding:11px 12px;font:inherit;outline:none;transition:border-color 120ms ease,box-shadow 120ms ease}
input[type=text]:focus,input[type=password]:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(42,171,238,.14)}
input::placeholder{color:var(--tertiary)}
.field{margin-bottom:16px}
button{width:100%;border:1px solid var(--accent);background:var(--accent);color:#fff;border-radius:6px;padding:11px 14px;font:inherit;font-weight:600;cursor:pointer;transition:background 120ms ease,border-color 120ms ease}
button:hover:not(:disabled){background:var(--accent-hover);border-color:var(--accent-hover)}
button:disabled{opacity:.6;cursor:default}
.err{display:flex;gap:8px;align-items:flex-start;background:var(--danger-bg);border:1px solid var(--danger);color:var(--danger);border-radius:6px;padding:10px 12px;font-size:13px;margin-bottom:18px;line-height:1.45}
.err:before{content:"!";font-weight:700;flex:none;width:16px;height:16px;border:1px solid currentColor;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:11px;margin-top:1px}
.foot{margin-top:22px;padding-top:16px;border-top:1px solid var(--border);color:var(--tertiary);font-size:11px;line-height:1.6;display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}
.foot code{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:11px}
.theme{background:none;border:1px solid var(--border);color:var(--muted);width:auto;padding:3px 8px;font-size:11px;font-weight:400;border-radius:4px}
.theme:hover{background:var(--surface);border-color:var(--border-strong);color:var(--fg)}
@media(max-width:420px){.card{padding:26px 20px}}
</style>
</head>
<body>
<form class="card" method="post" action="/login" autocomplete="on">
  <div class="brand"><span class="dot"></span>Telegram Archive</div>
  <p class="sub">这个归档库是私有的，请先登录。</p>
  {{ERROR}}
  <div class="field">
    <label for="u">账号</label>
    <input id="u" name="username" type="text" autocomplete="username" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="用户名" value="{{USER}}" required autofocus>
  </div>
  <div class="field">
    <label for="p">密码</label>
    <input id="p" name="password" type="password" autocomplete="current-password" placeholder="密码" required>
  </div>
  <input type="hidden" name="next" value="{{NEXT}}">
  <button type="submit" id="go">登录</button>
  <div class="foot">
    <span>会话 {{TTL}} 后过期</span>
    <button type="button" class="theme" id="theme">切换主题</button>
  </div>
</form>
<script>
(function(){
  var KEY="tdl-archive-theme";
  function apply(t){ if(t==="light"){document.documentElement.setAttribute("data-theme","light");}else{document.documentElement.removeAttribute("data-theme");} }
  try{ apply(localStorage.getItem(KEY)); }catch(e){}
  document.getElementById("theme").addEventListener("click",function(){
    var light=document.documentElement.getAttribute("data-theme")==="light";
    var next=light?"dark":"light";
    apply(next);
    try{ localStorage.setItem(KEY,next); }catch(e){}
  });
  document.querySelector("form").addEventListener("submit",function(){
    var b=document.getElementById("go");
    b.disabled=true; b.textContent="验证中…";
  });
  var p=document.getElementById("p");
  if(document.getElementById("u").value){ p.focus(); }
})();
</script>
</body>
</html>
